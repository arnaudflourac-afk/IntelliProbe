[package]
name = "intelliprobe"
version = "2.0.0"
edition = "2021"
authors = ["Arnaud Flourac"]
description = "Profileur de cartes SBC et de stations : matériel, accélérateurs IA, environnements de dev et librairies réellement disponibles"
license = "Apache-2.0"

[[bin]]
name = "intelliprobe"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
regex = "1.10"
which = "6.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
