<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntelliProbe</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #131722; --panel2: #1a1f2d; --border: #262c3d;
    --text: #e7e9ee; --muted: #8b93a7; --accent: #22c3e6;
    --ok: #2ecc71; --warn: #f0b429; --bad: #ef5350; --info: #5b9cf5;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --panel: #ffffff; --panel2: #f0f2f5; --border: #dde1e8; --text: #1b1f27; --muted: #5d6576; --accent: #0a84a8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 16px 0; max-width: 1280px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 22px; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  nav { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); }
  nav .inner { max-width: 1280px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; }
  nav button { background: none; border: 0; color: var(--muted); padding: 12px 12px; font: inherit; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  section.tab { display: none; }
  section.tab.active { display: block; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .card h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .card .big { font-size: 20px; font-weight: 600; word-break: break-word; }
  .card .small { color: var(--muted); font-size: 13px; }
  h2 { font-size: 16px; margin: 24px 0 10px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: var(--panel2); font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  tr:last-child td { border-bottom: 0; }
  td { word-break: break-word; }
  .tablewrap { overflow-x: auto; }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .pill.info { background: color-mix(in srgb, var(--info) 18%, transparent); color: var(--info); }
  .finding { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-left-width: 4px; border-radius: 8px; background: var(--panel); margin-bottom: 8px; }
  .finding.ok { border-left-color: var(--ok); } .finding.warn { border-left-color: var(--warn); }
  .finding.missing { border-left-color: var(--bad); } .finding.info { border-left-color: var(--info); }
  .finding .t { font-weight: 600; }
  .finding .d { color: var(--muted); font-size: 13px; }
  .finding .h { font-size: 13px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 12.5px; }
  input[type=search] { width: 100%; max-width: 420px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; margin-bottom: 10px; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; margin: 0 0 16px; }
  .note { color: var(--muted); font-size: 12.5px; margin: -8px 0 16px; }
  a.btn, button.btn { display: inline-block; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; text-decoration: none; }
  .rec { background: var(--panel); border: 1px solid var(--border); border-left-width: 4px; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .rec.essentiel { border-left-color: var(--bad); } .rec.recommandé { border-left-color: var(--warn); } .rec.optionnel { border-left-color: var(--border); }
  .rec .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px; }
  .rec .title { font-weight: 650; font-size: 15px; }
  .rec .why { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .rec ol { margin: 0; padding-left: 20px; }
  .rec li { margin: 4px 0; }
  .step { display: flex; gap: 8px; align-items: flex-start; }
  .step code { flex: 1; white-space: pre-wrap; word-break: break-word; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  .copy { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 2px 8px; cursor: pointer; font: inherit; font-size: 12px; }
  .avoid { margin-top: 8px; font-size: 13px; }
  .avoid div { color: var(--bad); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters button { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 4px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .filters button.on { border-color: var(--accent); color: var(--accent); }
  pre { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; overflow: auto; max-height: 70vh; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Intelli<span>Probe</span> — <span id="host"></span></h1>
  <div class="sub" id="subtitle"></div>
</header>
<nav><div class="inner" id="tabs"></div></nav>
<main id="app"></main>

<script id="report-data" type="application/json">/*__REPORT_JSON__*/null</script>
<script>
"use strict";
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const or = (v, d = "—") => (v === null || v === undefined || v === "" ? d : v);
const arr = (v) => (Array.isArray(v) ? v : []);
const gb = (mb) => (mb ? (mb / 1024).toFixed(1) + " Go" : "—");

function table(headers, rows, opts = {}) {
  if (!rows.length) return `<p class="empty">${esc(opts.empty || "Aucun élément détecté.")}</p>`;
  const id = opts.id ? ` id="${opts.id}"` : "";
  return `<div class="tablewrap"><table${id}><thead><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>` +
    rows.map((r) => `<tr>${r.map((c) => `<td>${c && c.__html !== undefined ? c.__html : esc(or(c))}</td>`).join("")}</tr>`).join("") +
    `</tbody></table></div>`;
}
const html = (s) => ({ __html: s });
const pill = (text, kind) => html(`<span class="pill ${kind}">${esc(text)}</span>`);
const statusPill = (s) => pill(s, s === "utilisable" ? "ok" : s === "partiel" ? "warn" : "bad");
const yes = (b) => pill(b ? "oui" : "non", b ? "ok" : "bad");
const chips = (list) => (list.length ? `<div class="chips">${list.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div>` : `<p class="empty">Aucun.</p>`);
const card = (title, big, small = "") => `<div class="card"><h3>${esc(title)}</h3><div class="big">${esc(or(big))}</div>${small ? `<div class="small">${esc(small)}</div>` : ""}</div>`;
const socName = (c) => { if (!c) return null; const [v, chip] = c.includes(",") ? c.split(",") : ["", c]; return (v ? v.charAt(0).toUpperCase() + v.slice(1) + " " : "") + chip.toUpperCase(); };

// Une étape ressemble à une commande si elle commence par un outil courant.
const isCmd = (t) => /^(sudo |pip|python|uv |curl |docker |cargo |rustup |cmake |gst-launch|ffmpeg |echo |printf |scp |i2cdetect |ollama |git |\/)/.test(t) || /^\S+\/python3? -m /.test(t);

function guide(r) {
  const recs = arr(r.recommendations);
  if (!recs.length) return `<p class="empty">Aucune recommandation (rapport d'une ancienne version : relancer intelliprobe).</p>`;
  const count = (p) => recs.filter((x) => x.priority === p).length;
  let s = `<div class="grid">${card("Essentiel", count("essentiel"), "à faire avant de commencer")}${card("Recommandé", count("recommandé"), "évite des problèmes plus tard")}${card("Optionnel", count("optionnel"), "pour aller plus loin")}</div>`;
  s += `<div class="filters" id="rec-filters">${["tout", "essentiel", "recommandé", "optionnel"].map((p, i) => `<button data-p="${p}" class="${i === 0 ? "on" : ""}">${esc(p)}</button>`).join("")}</div>`;
  s += recs.map((x) => {
    const kind = x.priority === "essentiel" ? "bad" : x.priority === "recommandé" ? "warn" : "info";
    const steps = arr(x.steps).map((st) => {
      const [cmd, comment] = st.includes("   # ") ? st.split("   # ") : [st, ""];
      return isCmd(cmd)
        ? `<li><div class="step"><code>${esc(cmd)}</code><button class="copy" data-copy="${esc(cmd)}">copier</button></div>${comment ? `<div class="muted small">${esc(comment)}</div>` : ""}</li>`
        : `<li>${esc(st)}</li>`;
    }).join("");
    const avoid = arr(x.avoid).map((a) => `<div>✘ ${esc(a)}</div>`).join("");
    return `<div class="rec ${esc(x.priority)}" data-p="${esc(x.priority)}"><div class="head"><span class="pill ${kind}">${esc(x.priority)}</span><span class="pill info">${esc(x.domain)}</span><span class="title">${esc(x.title)}</span></div><div class="why">${esc(x.rationale)}</div>${steps ? `<ol>${steps}</ol>` : ""}${avoid ? `<div class="avoid"><b>À éviter</b>${avoid}</div>` : ""}</div>`;
  }).join("");
  return s;
}

function overview(r) {
  const b = r.bench;
  const root = arr(r.storage?.filesystems).find((f) => f.mount === "/");
  let s = `<div class="grid">` +
    card("Carte", r.board?.model, [socName(r.board?.soc), r.board?.jetson ? "L4T " + or(r.board.jetson.l4t_release) : null].filter(Boolean).join(" · ")) +
    card("Système", r.os?.pretty_name, `${or(r.os?.arch)} · noyau ${or(r.os?.kernel)}${r.os?.userland_bits ? " · userland " + r.os.userland_bits + " bits" : ""}`) +
    card("CPU", r.cpu?.model, `${r.cpu?.logical_cores} cœurs${r.cpu?.temperature_c != null ? " · " + r.cpu.temperature_c + " °C" : ""}`) +
    card("Mémoire", gb(r.memory?.total_mb), `${gb(r.memory?.available_mb)} disponibles · swap ${gb(r.memory?.swap_total_mb)}`) +
    card("Stockage système", r.storage?.root_device_kind, root ? `${root.free_gb} Go libres sur ${root.total_gb} Go` : "") +
    card("GPU", arr(r.gpus).length ? arr(r.gpus).map((g) => g.name).join(" + ") : "aucun", "") +
    card("NPU", arr(r.npus).length ? arr(r.npus).map((n) => n.name).join(" + ") : "aucun", arr(r.npus).map((n) => n.status).join(" · ")) +
    (b ? card("Mesures", `${b.cpu_multi_gflops} GFLOPS`, `1 cœur ${b.cpu_single_gflops} GFLOPS · mémoire ${b.mem_read_multi_gbs} Go/s${b.disk ? " · disque " + b.disk.write_mbs + " Mo/s" : ""}`) : "") +
    `</div>`;
  s += `<h2>Voies d'accélération IA</h2>` + table(["Voie", "État", "Matériel", "Driver", "Runtime", "Utilisée par", "Détail"],
    arr(r.ai?.paths).map((p) => [p.name, statusPill(p.status), yes(p.hardware), yes(p.driver), yes(p.runtime), arr(p.bindings).join(", "), p.detail]));
  s += `<h2>Constats</h2>` + (arr(r.analysis?.findings).map((f) => `<div class="finding ${esc(f.level)}"><div>${{ ok: "✔", warn: "⚠", missing: "✘", info: "ℹ" }[f.level] || "•"}</div><div><div class="t">${esc(f.title)} <span class="muted small">· ${esc(f.category)}</span></div>${f.detail ? `<div class="d">${esc(f.detail)}</div>` : ""}${f.hint ? `<div class="h">→ ${esc(f.hint)}</div>` : ""}</div></div>`).join("") || `<p class="empty">Aucun constat.</p>`);
  return s;
}

function hardware(r) {
  const c = r.cpu || {};
  let s = `<h2>CPU</h2>` + table(["Élément", "Valeur"], [
    ["Modèle", c.model], ["Fabricant", c.vendor],
    ["Cœurs", `${c.logical_cores} logiques${c.physical_cores ? ", " + c.physical_cores + " physiques" : ""}`],
    ...arr(c.clusters).map((k) => ["Cluster", `${k.cpus.length}× ${k.name}${k.max_mhz ? " @ " + (k.min_mhz ? k.min_mhz + "–" : "") + k.max_mhz + " MHz" : ""} (cpu ${k.cpus.join(",")})`]),
    ["Gouverneur", c.governor], ["Température", c.temperature_c != null ? c.temperature_c + " °C" : null],
  ]);
  s += table(["Extension", "Intérêt"], arr(c.isa_features).map((f) => [html(`<code>${esc(f.flag)}</code>`), f.description]), { empty: "Aucune extension SIMD notable détectée." });
  s += `<h2>Carte</h2>` + table(["Élément", "Valeur"], [
    ["Modèle", r.board?.model], ["SoC", socName(r.board?.soc)], ["Famille SoC", r.board?.soc_family], ["ID SoC", r.board?.soc_id],
    ["Compatible", arr(r.board?.dt_compatible).join(", ")], ["Firmware", r.board?.firmware],
    ["Jetson", r.board?.jetson ? `L4T ${or(r.board.jetson.l4t_release)}, JetPack ${or(r.board.jetson.jetpack)}` : null],
    ["Révision Raspberry Pi", r.board?.raspberry_pi_revision],
  ].filter((x) => x[1]));
  s += `<h2>Système</h2>` + table(["Élément", "Valeur"], [
    ["OS", r.os?.pretty_name], ["Noyau", r.os?.kernel], ["Architecture", r.os?.arch], ["Userland", r.os?.userland_bits ? r.os.userland_bits + " bits" : null],
    ["Architecture des paquets", r.os?.package_arch], ["libc", r.os?.libc], ["Init", r.os?.init], ["Virtualisation", or(r.os?.virtualization, "aucune (matériel réel)")],
    ["Paquets installés", r.os?.installed_packages != null ? `${r.os.installed_packages} (${r.os.package_manager})` : null],
    ["Charge", r.os?.load_avg ? r.os.load_avg.join(" ") : null], ["Bureau", r.os?.desktop], ["Shell", r.os?.shell],
  ]);
  s += `<h2>Mémoire et stockage</h2>` + table(["Élément", "Valeur"], [
    ["RAM", `${gb(r.memory?.total_mb)} (${gb(r.memory?.available_mb)} disponibles)`],
    ["Swap", `${gb(r.memory?.swap_total_mb)} (${gb(r.memory?.swap_free_mb)} libres)`],
    ...arr(r.memory?.zram).map((z) => ["zram " + z.name, `${z.disksize_mb} Mo, ${or(z.algorithm)}`]),
    ["Système installé sur", r.storage?.root_device_kind],
  ]);
  s += table(["Disque", "Type", "Taille", "Modèle", "Amovible"], arr(r.storage?.devices).map((d) => [d.name, d.kind, d.size_gb + " Go", d.model, d.removable ? "oui" : "non"]));
  s += table(["Montage", "Périphérique", "FS", "Total", "Libre"], arr(r.storage?.filesystems).map((f) => [f.mount, f.device, f.fstype, f.total_gb + " Go", f.free_gb + " Go"]));
  s += `<h2>GPU</h2>` + table(["Nom", "Driver", "VRAM", "Fréq. max", "Temp.", "Nœud", "Source"], arr(r.gpus).map((g) => [g.name, [g.driver, g.driver_version].filter(Boolean).join(" "), g.vram_mb ? g.vram_mb + " Mo" : null, g.max_freq_mhz ? g.max_freq_mhz + " MHz" : null, g.temperature_c != null ? g.temperature_c + " °C" : null, g.render_node, g.source]), { empty: "Aucun GPU détecté." });
  s += `<h2>NPU / accélérateurs IA</h2>` + table(["Nom", "État", "Driver", "Nœuds", "Runtime trouvé", "TOPS constructeur", "Source"], arr(r.npus).map((n) => [n.name, n.status, [n.driver, n.driver_version].filter(Boolean).join(" "), arr(n.device_nodes).join(", "), arr(n.runtime_found).join(", ") || "aucun", n.datasheet_tops, n.source]), { empty: "Aucun NPU détecté." });
  const k = r.compute || {};
  const rows = [];
  if (k.cuda) rows.push(["CUDA", `driver ${or(k.cuda.driver_version)} · CUDA max ${or(k.cuda.driver_cuda_version)} · toolkit ${or(k.cuda.toolkit_version, "absent")} · cuDNN ${or(k.cuda.cudnn, "absent")} · TensorRT ${or(k.cuda.tensorrt, "absent")}`]);
  arr(k.opencl_platforms).forEach((p) => rows.push(["OpenCL", `${p.name} : ${arr(p.devices).join(", ")}`]));
  if (arr(k.opencl_icds).length) rows.push(["OpenCL ICD", k.opencl_icds.join(", ")]);
  arr(k.vulkan_devices).forEach((d) => rows.push(["Vulkan", `${d.name} (${or(d.device_type)}, API ${or(d.api_version)}, ${or(d.driver)})`]));
  if (arr(k.vulkan_icds).length) rows.push(["Vulkan ICD", k.vulkan_icds.join(", ")]);
  if (k.rocm_version) rows.push(["ROCm", k.rocm_version]);
  if (k.vaapi) rows.push(["VA-API", `${or(k.vaapi.driver)} — ${arr(k.vaapi.profiles).join(", ")}`]);
  s += `<h2>API de calcul</h2>` + table(["API", "Détail"], rows, { empty: "Aucune API de calcul GPU détectée." });
  s += `<h2>Capteurs de température</h2>` + table(["Capteur", "°C"], arr(r.interfaces?.sensors).map((x) => [x.name, x.temp_c]));
  return s;
}

function video(r) {
  const v = r.video || {};
  let s = `<h2>Codecs matériels exposés</h2>` + table(["Codec", "Sens", "Backend", "Périphérique"], arr(v.hw_codecs).map((c) => [c.codec, c.direction === "encode" ? "encodage" : "décodage", c.backend, c.device]), { empty: "Aucun codec matériel exposé via V4L2 ou VA-API." });
  s += `<h2>Périphériques V4L2</h2>` + table(["Périphérique", "Nom", "Driver", "Rôles", "Produit", "Consomme"], arr(v.v4l2_devices).map((d) => [d.path, d.name, d.error ? pill(d.error, "warn") : d.driver, arr(d.roles).join(", "), arr(d.capture_formats).join(" "), arr(d.output_formats).join(" ")]), { empty: "Aucun /dev/video*." });
  s += `<h2>Blocs constructeur</h2>` + chips(arr(v.vendor_nodes));
  const rows = [];
  if (v.ffmpeg) rows.push(["FFmpeg " + or(v.ffmpeg.version, ""), `encodeurs matériels testés avec succès : ${arr(v.ffmpeg.working_encoders).join(", ") || "aucun"} · hwaccels : ${arr(v.ffmpeg.hwaccels).join(", ") || "aucun"} · encodeurs HW compilés : ${arr(v.ffmpeg.hw_encoders).join(", ") || "aucun"} · décodeurs HW compilés : ${arr(v.ffmpeg.hw_decoders).join(", ") || "aucun"}`]);
  if (v.gstreamer) rows.push(["GStreamer " + or(v.gstreamer.version, ""), arr(v.gstreamer.hw_elements).join(", ") || "aucun élément matériel"]);
  rows.push(["libcamera", v.libcamera ? "présent" : "absent"]);
  s += `<h2>Logiciels</h2>` + table(["Outil", "Détail"], rows) + `<p class="note">Les encodeurs « compilés » dans FFmpeg ne sont utilisables que si le matériel et le driver correspondants sont présents.</p>`;
  return s;
}

function interfaces(r) {
  const i = r.interfaces || {};
  const rows = [
    ...arr(i.gpio_chips).map((g) => ["GPIO", `${g.dev} ${or(g.label, "")} ${g.lines ? "(" + g.lines + " lignes)" : ""}`]),
    ...arr(i.i2c_buses).map((b) => ["I2C", `${b.dev} ${or(b.name, "")}`]),
    ...arr(i.spi_devices).map((d) => ["SPI", d]),
    ...arr(i.uarts).map((u) => ["UART", `${u.dev} (${or(u.name)})`]),
    ...arr(i.can).map((c) => ["CAN", c]),
    ...arr(i.pwm_chips).map((p) => ["PWM", `${p.dev} ${or(p.name, "")}`]),
    ...arr(i.watchdogs).map((w) => ["Watchdog", w]),
    ...arr(i.bluetooth).map((b) => ["Bluetooth", b]),
  ];
  let s = `<h2>Bus et E/S</h2>` + table(["Type", "Détail"], rows, { empty: "Aucun bus GPIO/I2C/SPI/UART accessible." });
  s += `<h2>Droits d'accès de ${esc(or(r.os?.user, "l'utilisateur"))}</h2><p class="note">Groupes : ${esc(arr(r.os?.user_groups).join(", ") || "—")}</p>` +
    table(["Type", "Nœud", "Groupe propriétaire", "Accès lecture/écriture"], arr(i.access).map((a) => [a.kind, a.node, a.group, yes(a.writable)]), { empty: "Aucun nœud matériel à vérifier." });
  if (arr(i.dt_peripherals).length) s += `<h2>Contrôleurs du device-tree</h2><p class="note">Un contrôleur désactivé est présent dans le SoC et généralement activable par overlay.</p>` + table(["Contrôleur", "Activés", "Désactivés"], i.dt_peripherals.map((p) => [p.kind, p.enabled, p.disabled]));
  s += `<h2>Réseau</h2>` + table(["Interface", "Type", "État", "Vitesse", "Driver"], arr(i.network).map((n) => [n.name, n.kind, n.state, n.speed_mbps ? n.speed_mbps + " Mb/s" : null, n.driver]));
  s += `<h2>USB</h2>` + table(["ID", "Fabricant", "Produit", "Vitesse"], arr(i.usb_devices).filter((u) => !u.is_hub).map((u) => [u.id, u.manufacturer, u.product, u.speed_mbps ? u.speed_mbps + " Mb/s" : null]), { empty: "Aucun périphérique USB (hors hubs)." });
  s += `<h2>PCI</h2>` + table(["Slot", "ID", "Classe", "Description", "Driver", "Lien"], arr(i.pci_devices).map((p) => [p.slot, p.id, p.class, p.description, p.driver, p.link]), { empty: "Aucun bus PCI." });
  return s;
}

function dev(r) {
  const d = r.dev || {};
  const tools = [...arr(d.tools), ...arr(r.ai?.runtimes)];
  const cats = [...new Set(tools.map((t) => t.category))];
  let s = `<input type="search" placeholder="Filtrer les outils…" data-filter="tbl-tools">`;
  s += table(["Catégorie", "Outil", "Version", "Chemin"], cats.flatMap((c) => tools.filter((t) => t.category === c).map((t) => [c, t.name, t.version, html(`<span class="mono">${esc(or(t.path))}</span>`)])), { id: "tbl-tools" });
  s += `<h2>Compilateurs croisés</h2>` + chips(arr(d.cross_compilers));
  s += `<h2>Conteneurs</h2>` + table(["Élément", "Valeur"], [
    ["Démon Docker accessible", d.docker_daemon_access == null ? "Docker absent" : d.docker_daemon_access ? "oui" : "non"],
    ["Runtimes Docker", arr(d.docker_runtimes).join(", ")],
    ["Émulation binfmt (multi-arch)", arr(d.binfmt).join(", ")],
  ]);
  if (arr(r.ai?.ollama_models).length) s += `<h2>Modèles Ollama</h2>` + chips(r.ai.ollama_models);
  s += `<h2>Recherchés mais absents</h2>` + chips(arr(d.missing).map((t) => t.name));
  return s;
}

function python(r) {
  const p = r.python;
  if (!p) return `<p class="empty">Python 3 introuvable.</p>`;
  let s = `<div class="grid">${card("Interpréteur", "Python " + or(p.version), p.executable + (p.virtualenv ? " · env " + p.virtualenv : ""))}${card("Paquets", arr(p.packages).length, "inventaire complet (importlib.metadata)")}</div>`;
  s += `<h2>Frameworks IA (import réel)</h2>` + table(["Framework", "Version", "Import", "Accélérateurs vus", "Détails"], arr(p.frameworks).map((f) => [f.name, f.version, f.error ? pill(f.error, "bad") : f.import_ok ? pill("ok", "ok") : pill("non testé", "info"), arr(f.accelerators).join(", ") || "CPU uniquement", arr(f.details).join(" · ")]), { empty: "Aucun framework IA installé." });
  s += `<h2>Tous les paquets</h2><input type="search" placeholder="Filtrer les paquets…" data-filter="tbl-py">` + table(["Paquet", "Version", "Description"], arr(p.packages).map((x) => [x.name, x.version, x.description]), { id: "tbl-py" });
  return s;
}

function libraries(r) {
  const k = r.packages || {};
  let s = `<div class="grid">${card("Librairies partagées", k.shared_libs_count, "cache ldconfig + dossiers CUDA/Tegra/ROCm")}${card("Avec headers (pkg-config)", arr(k.pkg_config).length, "utilisables pour compiler")}${card("npm global / cargo", arr(k.node_global).length + " / " + arr(k.cargo_installed).length)}</div>`;
  s += `<h2>Librairies remarquables</h2><input type="search" placeholder="Filtrer…" data-filter="tbl-notable">` + table(["Catégorie", "Librairie", "Description", "Chemin"], arr(k.notable_libs).map((l) => [l.category, l.soname, l.description, html(`<span class="mono">${esc(l.path)}</span>`)]), { id: "tbl-notable" });
  s += `<h2>Librairies de développement (pkg-config)</h2><input type="search" placeholder="Filtrer…" data-filter="tbl-pc">` + table(["Module", "Version", "Description"], arr(k.pkg_config).map((p) => [p.name, p.version, p.description]), { id: "tbl-pc", empty: "pkg-config absent ou aucun module." });
  if (arr(k.node_global).length) s += `<h2>npm global</h2>` + chips(k.node_global.map((p) => p.name + " " + or(p.version, "")));
  if (arr(k.cargo_installed).length) s += `<h2>Binaires cargo</h2>` + chips(k.cargo_installed.map((p) => p.name + " " + or(p.version, "")));
  s += `<h2>Toutes les librairies partagées</h2><input type="search" placeholder="Filtrer…" data-filter="tbl-all">` + table(["Soname"], arr(k.all_shared_libs).map((x) => [html(`<span class="mono">${esc(x)}</span>`)]), { id: "tbl-all" });
  return s;
}

function measures(r) {
  const b = r.bench, l = r.analysis?.llm;
  let s = "";
  if (b) {
    s += `<h2>Mesures</h2>` + table(["Mesure", "Résultat"], [
      ["CPU FP32, 1 cœur", b.cpu_single_gflops + " GFLOPS"], [`CPU FP32, ${b.threads} threads`, b.cpu_multi_gflops + " GFLOPS"],
      ["Lecture mémoire, 1 thread", b.mem_read_single_gbs + " Go/s"], ["Lecture mémoire, tous threads", b.mem_read_multi_gbs + " Go/s"],
      ...(b.disk ? [[`Disque (${b.disk.path}, ${b.disk.size_mb} Mo)`, `écriture ${b.disk.write_mbs} Mo/s · lecture ${or(b.disk.read_mbs)} Mo/s`]] : []),
    ]) + `<p class="note">CPU : noyau FP32 vectorisé (SIMD de base de l'architecture). Mémoire : lecture séquentielle de gros tampons. Disque : écriture avec fsync, relecture hors cache.</p>`;
  } else s += `<p class="empty">Mesures non effectuées (option --no-bench).</p>`;
  if (l) {
    s += `<h2>LLM quantifiés Q4 — estimation calculée</h2><p class="note">RAM disponible ${l.ram_budget_gb} Go${l.vram_budget_gb ? " · VRAM " + l.vram_budget_gb + " Go" : ""}</p>`;
    s += table(["Paramètres", "Taille Q4", "Tient en RAM", "Tient en VRAM", "Débit CPU max"], arr(l.rows).map((x) => [x.params_b + "B", x.size_gb.toFixed(2) + " Go", yes(x.fits_ram), x.fits_vram == null ? "—" : yes(x.fits_vram), x.max_tokens_per_s != null ? "≤ " + x.max_tokens_per_s + " tok/s" : "—"]));
    s += `<p class="note">${esc(l.method)}</p>`;
  }
  return s;
}

function raw(r) {
  const timings = arr(r.meta?.probe_timings).map(([n, t]) => [n, t.toFixed(2) + " s"]);
  return `<p><button class="btn" id="dl">Télécharger le JSON</button></p><h2>Durée des sondes</h2>` + table(["Sonde", "Durée"], timings) + `<h2>JSON</h2><pre>${esc(JSON.stringify(r, null, 2))}</pre>`;
}

const TABS = [["Guide", guide], ["Vue d'ensemble", overview], ["Matériel", hardware], ["Vidéo", video], ["Interfaces", interfaces], ["Développement", dev], ["Python", python], ["Librairies", libraries], ["Mesures & LLM", measures], ["Données brutes", raw]];

function boot(r) {
  document.getElementById("host").textContent = or(r.os?.hostname, "machine");
  document.getElementById("subtitle").textContent = `${or(r.board?.model, "")} · rapport du ${or(r.meta?.generated_at)} · IntelliProbe ${or(r.meta?.tool_version)}`;
  const app = document.getElementById("app"), tabs = document.getElementById("tabs");
  TABS.forEach(([name, fn], i) => {
    const sec = document.createElement("section");
    sec.className = "tab"; sec.id = "tab" + i;
    try { sec.innerHTML = fn(r); } catch (e) { sec.innerHTML = `<p class="empty">Erreur d'affichage : ${esc(e.message)}</p>`; }
    app.appendChild(sec);
    const btn = document.createElement("button");
    btn.textContent = name;
    btn.onclick = () => show(i);
    tabs.appendChild(btn);
  });
  const show = (i) => {
    document.querySelectorAll("section.tab").forEach((s, j) => s.classList.toggle("active", i === j));
    document.querySelectorAll("nav button").forEach((b, j) => b.classList.toggle("active", i === j));
    try { localStorage.setItem("ip-tab", String(i)); } catch (e) {}
  };
  let start = 0;
  try { start = Math.min(TABS.length - 1, parseInt(localStorage.getItem("ip-tab") || "0", 10) || 0); } catch (e) {}
  show(start);
  document.querySelectorAll("input[data-filter]").forEach((inp) => inp.addEventListener("input", () => {
    const q = inp.value.toLowerCase();
    document.querySelectorAll(`#${inp.dataset.filter} tbody tr`).forEach((tr) => { tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none"; });
  }));
  document.querySelectorAll("#rec-filters button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("#rec-filters button").forEach((x) => x.classList.toggle("on", x === b));
    document.querySelectorAll(".rec").forEach((el) => { el.style.display = b.dataset.p === "tout" || el.dataset.p === b.dataset.p ? "" : "none"; });
  }));
  document.querySelectorAll("button.copy").forEach((b) => b.addEventListener("click", () => {
    const done = () => { b.textContent = "copié"; setTimeout(() => (b.textContent = "copier"), 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.copy).then(done, () => {});
  }));
  const dl = document.getElementById("dl");
  if (dl) dl.onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(r, null, 2)], { type: "application/json" }));
    a.download = `intelliprobe-${or(r.os?.hostname, "rapport")}.json`;
    a.click();
  };
}

const data = JSON.parse(document.getElementById("report-data").textContent);
if (data) boot(data);
else fetch("report.json").then((x) => x.json()).then(boot).catch(() => { document.getElementById("app").innerHTML = '<p class="empty">Aucune donnée : lancer « intelliprobe » pour générer le rapport.</p>'; });
</script>
</body>
</html>
